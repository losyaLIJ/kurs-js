<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Athletes</title>
</head>

<body>
    <div class="container">
        <form id="athleteForm">
            <fieldset>
                <legend>Общие данные</legend>

                <label>Имя: <input type="text" id="name" required></label>
                <label>Звание: <input type="text" id="rank" required></label>
                <label>Страна: <input type="text" id="country" required></label>
                <label>Возраст: <input type="number" id="age" required></label>
                <label>Вид спорта:
                    <select id="athleteType" required>
                        <option value="" disabled selected>Выберите тип</option>
                        <option value="soccer">Футболист</option>
                        <option value="swimmer">Пловец</option>
                    </select>
                </label>
            </fieldset>

            <fieldset id="soccerFields" class="hidden">
                <legend>Футболист</legend>
                <label> Позиция: <input type="text" id="position"> </label>
                <label>Номер: <input type="number" id="number"></label>
                <label>Клуб: <input type="text" id="club"></label>
            </fieldset>

            <fieldset id="swimmerFields" class="hidden">
                <legend>Пловец</legend>
                <label>Дистанция (м):<input type="number" id="distance"></label>
                <label>Стиль:<input type="text" id="style"></label>
                <label>Рекорд (сек):<input type="number" id="record"></label>
            </fieldset>

            <button type="submit">Сохранить</button>
        </form>
    </div>

    <h2>Список спортсменов</h2>
    <table id="athleteTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Спорт</th>
                <th>Звание</th>
                <th>Страна</th>
                <th>Возраст</th>
                <th>Доп. поле 1</th>
                <th>Доп. поле 2</th>
                <th>Доп. поле 3</th>
                <th>Удалить</th>
            </tr>
        </thead>
        <tbody>
            <!-- добавление через JS -->
        </tbody>
    </table>

</body>

</html>
